<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>記帳 App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2ec4a9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記帳">
<script>
  if('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>
<style>
  :root {
    --bg: #0d1b2a;
    --teal: #2ec4a9;
    --teal-dark: #25a892;
    --red: #e84040;
    --red-dark: #c93535;
    --card-bg: #ffffff;
    --card-dark: #162030;
    --card-border: #e8eaf0;
    --text-main: #1a2535;
    --text-light: #ffffff;
    --text-muted: #7a8a99;
    --text-red: #e84040;
    --text-teal: #2ec4a9;
    --tab-bg: #0a1422;
    --modal-bg: #1a2a3a;
    --input-bg: #243040;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    background: #111520;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }

  #phone-frame {
    width: 393px;
    height: 852px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 0 0 2px #2a2a3a, 0 0 0 10px #111118, 0 40px 80px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.05);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 500px) {
    html, body { background: var(--bg); align-items: flex-start; }
    #phone-frame { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  /* ====== SCREENS ====== */
  .screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .screen.active { display: flex; }

  /* ====== TOP BAR ====== */
  .top-bar {
    background: var(--teal);
    padding: 10px 20px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .top-bar h1 { color: white; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .top-bar .nav-btn {
    color: white; font-size: 20px; font-weight: 700;
    background: none; border: none; cursor: pointer; padding: 4px 10px; opacity: 0.9;
  }
  .top-bar .nav-btn:hover { opacity: 1; }

  /* ====== SCROLL CONTENT ====== */
  .scroll-content { flex: 1; overflow-y: auto; padding: 14px 12px 10px; -webkit-overflow-scrolling: touch; }
  .scroll-content::-webkit-scrollbar { width: 3px; }
  .scroll-content::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 2px; }
  .year-scroll { flex: 1; overflow-y: auto; padding: 8px 12px 6px; -webkit-overflow-scrolling: touch; }
  .year-scroll::-webkit-scrollbar { width: 3px; }
  .year-scroll::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 2px; }
  /* No-scroll variant for year screen — tries to fit everything */
  .year-noscroll { flex: 1; overflow-y: auto; padding: 6px 12px 4px; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
  .year-noscroll::-webkit-scrollbar { width: 3px; }
  .year-noscroll::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 2px; }

  /* ====== RECORD CARDS ====== */
  .record-card {
    background: var(--card-bg); border-radius: 10px; padding: 9px 14px; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    border: 1px solid var(--card-border); transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .record-card:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
  .record-card:active { transform: scale(0.98); }
  .record-card .left { font-size: 14px; color: var(--text-red); font-weight: 600; }
  .record-card .left.income { color: var(--text-teal); }
  .record-card .right { font-size: 14px; color: var(--text-muted); font-weight: 500; text-align: right; }
  .record-card .right span { color: var(--text-red); font-weight: 700; }
  .record-card .right span.income { color: var(--text-teal); }

  /* ====== CATEGORY BUTTONS ====== */
  .category-section { padding: 7px 12px 6px; background: var(--bg); flex-shrink: 0; }
  .cat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 6px; }
  .cat-btn {
    background: var(--red); color: white; border: none; border-radius: 10px; padding: 8px 4px;
    font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; line-height: 1.3;
    transition: background 0.15s, transform 0.1s; font-family: inherit;
  }
  .cat-btn.income { background: var(--teal); }
  .cat-btn:hover { filter: brightness(1.1); }
  .cat-btn:active { transform: scale(0.95); }
  .cat-btn span { display: block; font-size: 10px; opacity: 0.9; }

  /* ====== NAV BUTTONS ====== */
  .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 8px; flex-shrink: 0; }
  .nav-big-btn {
    background: white; color: var(--text-main); border: 1.5px solid #d0d8e8; border-radius: 10px;
    padding: 10px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center;
    transition: background 0.15s; font-family: inherit;
  }
  .nav-big-btn:hover { background: #f0f4fa; }

  /* ====== BOTTOM TABS ====== */
  .bottom-tabs {
    background: var(--tab-bg); display: flex; justify-content: space-around;
    padding: 8px 0 12px; flex-shrink: 0; border-top: 1px solid #1a2535;
  }
  .tab-btn {
    color: #4a6080; font-size: 14px; font-weight: 600; background: none; border: none;
    cursor: pointer; padding: 4px 20px; transition: color 0.15s; font-family: inherit;
  }
  .tab-btn.active { color: var(--teal); }
  .tab-btn:hover { color: #7a9ab8; }

  /* ====== MODAL OVERLAY ====== */
  .modal-overlay {
    display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.65);
    z-index: 100; align-items: flex-end; justify-content: center; backdrop-filter: blur(3px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .modal-overlay.open { display: flex; }
  /* When keyboard is up, modal slides above it */
  .modal-overlay.keyboard-up {
    align-items: flex-start;
    padding-top: 12px;
    overflow-y: auto;
  }
  .modal-box, .modal-box-dark {
    margin-bottom: 12px;
  }
  .modal-overlay.keyboard-up .modal-box,
  .modal-overlay.keyboard-up .modal-box-dark {
    margin-bottom: 0;
    margin-top: 0;
  }

  /* Light modal (記帳 style) */
  .modal-box {
    background: white; border-radius: 18px; width: calc(100% - 40px); max-width: 340px;
    padding: 24px 20px 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative; animation: modalIn 0.2s ease;
  }
  /* Dark modal (現倉 style) */
  .modal-box-dark {
    background: var(--modal-bg); border-radius: 18px; width: calc(100% - 40px); max-width: 340px;
    padding: 24px 20px 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    position: relative; animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.93) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 16px; text-align: center; }
  .modal-title-dark { font-size: 18px; font-weight: 700; color: white; margin-bottom: 16px; text-align: center; }

  .modal-field { margin-bottom: 12px; }
  .modal-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
  .modal-field label.dark { color: #7a9ab8; }
  .modal-field input, .modal-field textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid #dde4f0; border-radius: 10px;
    font-size: 15px; font-family: inherit; color: var(--text-main); outline: none;
    transition: border-color 0.15s; background: #f8fafc;
  }
  .modal-field input.dark, .modal-field textarea.dark {
    background: var(--input-bg); border: none; border-radius: 10px; color: white;
    font-size: 15px; padding: 14px 16px;
  }
  .modal-field input.dark::placeholder { color: #4a6080; }
  .modal-field input:focus, .modal-field textarea:focus { border-color: var(--teal); background: white; }
  .modal-field input.dark:focus { outline: 1.5px solid var(--teal); }
  .modal-field input[type="number"] { -moz-appearance: textfield; }
  .modal-field input[type="number"]::-webkit-inner-spin-button,
  .modal-field input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button {
    flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700;
    border: none; cursor: pointer; font-family: inherit; transition: filter 0.15s;
  }
  .modal-actions button:hover { filter: brightness(1.08); }
  .btn-cancel { background: #f0f3f8; color: var(--text-muted); }
  .btn-confirm { background: var(--teal); color: white; }
  .btn-confirm.expense { background: var(--red); }
  .btn-delete { background: #fff0f0; color: var(--red); border: 1.5px solid #ffd0d0 !important; }
  .btn-green { background: #27ae60; color: white; }
  .btn-orange { background: #e87820; color: white; }
  .modal-divider { height: 1px; background: #2a3a4a; margin: 16px 0; }

  /* Dark modal type tabs */
  .type-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
  .type-tab {
    padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; border: none; font-family: inherit; background: var(--input-bg); color: #7a9ab8;
    transition: background 0.15s, color 0.15s;
  }
  .type-tab.active { background: var(--teal); color: white; }

  /* ====== YEAR SCREEN ====== */
  .summary-card {
    background: white; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer;
  }
  .summary-circle {
    width: 56px; height: 56px; background: var(--teal); border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s;
  }
  .summary-circle:hover { transform: scale(1.05); }
  .summary-circle svg { width: 40px; height: 40px; }
  .summary-numbers { flex: 1; }
  .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; font-size: 13px; }
  .summary-row .label { color: var(--text-main); font-weight: 600; }
  .summary-row .amount-red { color: var(--red); font-weight: 700; font-size: 13px; }
  .summary-row .amount-teal { color: var(--teal); font-weight: 700; font-size: 13px; }

  .toggle-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 8px; border-radius: 8px; overflow: hidden; }
  .toggle-btn { padding: 9px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; transition: opacity 0.15s; font-family: inherit; }
  .toggle-btn.expense { background: var(--red); color: white; }
  .toggle-btn.income-btn { background: var(--teal); color: white; }
  .toggle-btn.inactive { opacity: 0.35; }

  .chart-container { background: white; border-radius: 12px; padding: 10px 8px 8px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  canvas#yearChart { width: 100%; }

  .month-list { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 12px; }
  .month-item {
    display: flex; justify-content: space-between; align-items: center; padding: 7px 16px;
    border-bottom: 1px solid #f0f4fa; cursor: pointer; transition: background 0.1s;
  }
  .month-item:last-child { border-bottom: none; }
  .month-item:hover { background: #f8fafc; }
  .month-name { color: var(--text-main); font-size: 14px; font-weight: 600; }
  .month-amounts { font-size: 12px; display: flex; gap: 10px; }
  .month-exp { color: var(--red); font-weight: 700; }
  .month-inc { color: var(--teal); font-weight: 700; }

  .back-big-btn {
    background: var(--teal); color: white; border: none; border-radius: 12px; padding: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit;
    margin-top: 2px; transition: background 0.15s; flex-shrink: 0;
  }
  .back-big-btn:hover { background: var(--teal-dark); }
  .red-big-btn {
    background: var(--red); color: white; border: none; border-radius: 12px; padding: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit;
    margin-top: 6px; transition: background 0.15s; flex-shrink: 0;
  }
  .red-big-btn:hover { background: var(--red-dark); }

  /* ====== PIE CHART SCREEN ====== */
  .pie-container { display: flex; flex-direction: column; align-items: center; padding: 20px 16px; }
  canvas#pieChart { width: 220px !important; height: 220px !important; margin-bottom: 20px; }
  .pie-legend { width: 100%; }
  .legend-item {
    display: flex; align-items: center; justify-content: space-between; padding: 10px 16px;
    border-bottom: 1px solid #1e2d3d; cursor: pointer; transition: background 0.1s; border-radius: 8px;
  }
  .legend-item:hover { background: #162030; }
  .legend-left { display: flex; align-items: center; gap: 10px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { color: white; font-size: 15px; font-weight: 600; }
  .legend-right { color: var(--text-muted); font-size: 14px; font-weight: 500; }

  /* ====== 現倉 SCREEN ====== */
  .cangku-header {
    background: var(--teal); border-radius: 14px; margin: 12px 12px 0; padding: 16px 18px;
    flex-shrink: 0;
  }
  .cangku-header-title { font-size: 14px; color: rgba(255,255,255,0.8); font-weight: 600; margin-bottom: 4px; text-align: center; }
  .cangku-header-total { font-size: 28px; font-weight: 800; color: white; text-align: center; margin-bottom: 12px; }
  .cangku-header-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cangku-stat { }
  .cangku-stat-label { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 600; margin-bottom: 2px; }
  .cangku-stat-val { font-size: 15px; font-weight: 700; color: white; }

  .cangku-table-header {
    display: grid; grid-template-columns: 2fr 1fr 2fr 1.5fr; gap: 4px;
    padding: 10px 14px; background: #1e2d3d; margin: 8px 12px 0; border-radius: 10px 10px 0 0;
    flex-shrink: 0;
  }
  .cangku-table-header span { font-size: 12px; color: #7a9ab8; font-weight: 700; text-align: center; }
  .cangku-table-header span:first-child { text-align: left; }
  .cangku-table-header span:last-child { text-align: right; }
  .sort-active { color: #2ec4a9 !important; }

  .cangku-list { flex: 1; overflow-y: auto; padding: 0 12px; -webkit-overflow-scrolling: touch; }
  .cangku-list::-webkit-scrollbar { width: 3px; }
  .cangku-list::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 2px; }

  .asset-row {
    background: white; border-radius: 10px; margin-bottom: 8px; padding: 12px 14px;
    display: grid; grid-template-columns: 2fr 1fr 2fr 1.5fr; gap: 4px; align-items: center;
    cursor: pointer; transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .asset-row:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
  .asset-row:active { transform: scale(0.98); }
  .asset-code { font-size: 14px; font-weight: 700; color: var(--text-main); }
  .asset-name { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .asset-price-cur { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .asset-price { font-size: 16px; font-weight: 700; color: var(--text-main); text-align: center; }
  .asset-shares { font-size: 14px; font-weight: 600; color: var(--text-main); text-align: center; }
  .asset-cost { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 2px; }
  .asset-pnl { font-size: 16px; font-weight: 800; text-align: right; }
  .pnl-pos { color: var(--teal); }
  .pnl-neg { color: var(--red); }

  .add-big-btn {
    background: var(--teal); color: white; border: none; border-radius: 0; padding: 16px;
    font-size: 17px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit;
    flex-shrink: 0; transition: background 0.15s;
  }
  .add-big-btn:hover { background: var(--teal-dark); }

  /* sort-active for table header highlight */
  .sort-active { color: #2ec4a9 !important; }

  /* ====== 資產詳情 SCREEN ====== */
  .asset-detail-header {
    background: white; padding: 14px 16px; flex-shrink: 0;
    display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr; gap: 4px; align-items: center;
  }
  .asset-detail-code { font-size: 16px; font-weight: 700; color: var(--text-main); }
  .asset-detail-name { font-size: 12px; color: var(--text-muted); }
  .asset-detail-curprice { font-size: 12px; color: var(--text-muted); }

  .txn-table-header {
    display: grid; grid-template-columns: 1.8fr 1fr 1.5fr 1fr 1fr; gap: 4px;
    padding: 10px 12px; background: #1e2d3d; flex-shrink: 0;
  }
  .txn-table-header span { font-size: 11px; color: #7a9ab8; font-weight: 700; text-align: center; }
  .txn-table-header span:first-child { text-align: left; }

  .txn-list { flex: 1; overflow-y: auto; padding: 0 12px; -webkit-overflow-scrolling: touch; }
  .txn-list::-webkit-scrollbar { width: 3px; }
  .txn-list::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 2px; }

  .txn-row {
    background: #162030; border-radius: 10px; margin-bottom: 6px; padding: 12px;
    display: grid; grid-template-columns: 1.8fr 1fr 1.5fr 1fr 1fr; gap: 4px; align-items: center;
    cursor: pointer; transition: background 0.1s;
  }
  .txn-row:hover { background: #1e2d3d; }
  .txn-date { font-size: 12px; color: #9ab0c8; font-weight: 600; }
  .txn-val { font-size: 13px; font-weight: 600; color: white; text-align: center; }
  .txn-val.neg { color: var(--red); }

  /* ====== 設置 SCREEN ====== */
  .settings-header {
    background: var(--teal); border-radius: 14px; margin: 12px 12px 0; padding: 16px 18px;
    flex-shrink: 0;
  }
  .settings-pie-wrap { display: flex; justify-content: center; padding: 10px 0 0; }
  canvas#settingsPie { }
  .settings-legend { padding: 16px; }
  .settings-legend-item {
    display: flex; align-items: center; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px solid #1e2d3d;
  }
  .settings-legend-item:last-child { border-bottom: none; }
  .settings-legend-left { display: flex; align-items: center; gap: 10px; }
  .settings-legend-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
  .settings-legend-name { color: white; font-size: 15px; font-weight: 600; }
  .settings-legend-val { color: #9ab0c8; font-size: 14px; }
  .settings-divider { height: 1px; background: #1e2d3d; margin: 6px 16px; }
  .settings-stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; font-size: 14px;
  }
  .settings-stat-label { color: #9ab0c8; }
  .settings-stat-red { color: var(--red); font-weight: 700; font-size: 15px; }
  .settings-stat-teal { color: var(--teal); font-weight: 700; font-size: 15px; }

  /* ====== Calendar ====== */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 8px; }
  .cal-header { text-align: center; font-size: 11px; color: var(--text-muted); font-weight: 700; padding: 4px 0; }
  .cal-day {
    text-align: center; font-size: 13px; padding: 7px 2px; border-radius: 6px;
    cursor: pointer; color: var(--text-main); transition: background 0.1s; font-weight: 500;
  }
  .cal-day:hover { background: #e8f4f0; }
  .cal-day.selected { background: var(--teal); color: white; font-weight: 700; }
  .cal-day.other-month { color: #ccc; }
  .cal-day.today { border: 1.5px solid var(--teal); }
  .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-nav button { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--teal); padding: 4px 8px; }
  .cal-month-label { font-size: 14px; font-weight: 700; color: var(--text-main); }

  /* month summary */
  .month-summary-card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .month-summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 15px; }
  .month-summary-row:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div id="phone-frame">

  <!-- ===== SCREEN: 記帳 ===== -->
  <div class="screen active" id="screen-ledger">

// ============================================================
// UTILITIES
// ============================================================
function dateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(s){return new Date(s.replace(/\//g,'-')+'T00:00:00');}
function formatDateDisplay(s){
  const d=parseDate(s);
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} - ${WEEKDAYS[d.getDay()]}`;
}
function fmtMoney(n){return '$'+Math.round(n).toLocaleString();}
function fmtNum(n,dec=2){return Number(n).toFixed(dec);}
function getCatInfo(id){return[...EXPENSE_CATS,...INCOME_CATS].find(c=>c.id===id)||{label:'?',sub:'?',id};}
function getRecordsByDate(ds){return records.filter(r=>r.date===ds);}
function getRecordsByMonth(y,m){return records.filter(r=>r.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));}
function getRecordsByYear(y){return records.filter(r=>r.date.startsWith(String(y)));}
function sumType(recs,type){return recs.filter(r=>r.type===type).reduce((a,r)=>a+r.amount,0);}

// Asset calculations
function getAssetShares(asset){
  return asset.txns.reduce((a,t)=>a+(t.shares||0),0);
}
function getAssetInvested(asset){
  return asset.txns.reduce((a,t)=>a+(t.invested||0),0);
}
// Returns current value in TWD for all types
function getAssetCurrentVal(asset){
  const shares=getAssetShares(asset);
  let price=asset.currentPrice||0;
  if(asset.type==='us'||asset.type==='crypto') price*=USD_TO_TWD;
  return shares*price;
}
// PnL: compare current TWD value vs invested amount
// For US stocks: invested is in USD, so convert to TWD for comparison
function getAssetPnlPct(asset){
  const invested=getAssetInvested(asset);
  if(!invested) return 0;
  const cur=getAssetCurrentVal(asset);
  // US invested is USD, need TWD equivalent for comparison
  const investedTWD = (asset.type==='us') ? invested*USD_TO_TWD : invested;
  return Math.round((cur-investedTWD)/Math.abs(investedTWD)*100);
}
function getLastHoldAvg(asset){
  // Return last txn's holdAvg, sorted by date
  const sorted=[...asset.txns].sort((a,b)=>a.date.localeCompare(b.date));
  if(!sorted.length) return 0;
  return sorted[sorted.length-1].holdAvg||0;
}

// Total asset value (TWD)
function calcTotalAssets(){
  const twdCash=settings.twdCash||0;
  const usdCash=(settings.usdCash||0)*USD_TO_TWD;
  const stocks=assets.reduce((s,a)=>s+getAssetCurrentVal(a),0);
  return twdCash+usdCash+stocks;
}
// Returns TWD invested for TW stocks + crypto
function calcTwStockInvested(){
  return assets.filter(a=>a.type==='tw').reduce((s,a)=>s+getAssetInvested(a),0);
}
// Returns USD invested for US stocks (raw USD amount)
function calcUsStockInvested(){
  return assets.filter(a=>a.type==='us').reduce((s,a)=>s+getAssetInvested(a),0);
}

function openEditModal(id){

    <button class="btn-delete" onclick="deleteRecord('${id}')">刪除</button>
    <button class="btn-confirm" onclick="saveRecord()">更新</button>`;

function saveRecord(){
  const amount=parseFloat(document.getElementById('modal-amount').value);
  if(!amount||amount<=0){document.getElementById('modal-amount').style.borderColor='#e84040';return;}
  document.getElementById('modal-amount').style.borderColor='';
  const note=document.getElementById('modal-note').value.trim();
  const dateVal=document.getElementById('modal-date-val').value;
  if(modalMode==='add'){
    const type=EXPENSE_CATS.find(c=>c.id===modalCategory)?'expense':'income';
    records.push({id:genId(),date:dateVal,cat:modalCategory,note,amount,type});
  } else {
    const rec=records.find(r=>r.id===editingId);
    if(rec){rec.note=note;rec.amount=amount;rec.date=dateVal;}
  }
  saveRecords(); closeModal('modal-overlay');
  const active=document.querySelector('.screen.active');
  if(active){if(active.id==='screen-ledger')renderLedger();if(active.id==='screen-month')renderMonth();if(active.id==='screen-year')renderYear();}
}
function deleteRecord(id){
  if(!confirm('確定要刪除此筆記錄？'))return;
  records=records.filter(r=>r.id!==id); saveRecords(); closeModal('modal-overlay');
  const active=document.querySelector('.screen.active');
  if(active){if(active.id==='screen-ledger')renderLedger();if(active.id==='screen-month')renderMonth();if(active.id==='screen-year')renderYear();}
}

function toggleYearChart(mode){
  if(mode==='expense') yearChartShowExp=!yearChartShowExp;
  else yearChartShowInc=!yearChartShowInc;
  // Keep at least one on
  if(!yearChartShowExp&&!yearChartShowInc){
    if(mode==='expense') yearChartShowExp=true; else yearChartShowInc=true;
  }
  const eb=document.getElementById('y-exp-btn'),ib=document.getElementById('y-inc-btn');
  if(eb) eb.classList.toggle('inactive',!yearChartShowExp);
  if(ib) ib.classList.toggle('inactive',!yearChartShowInc);
  renderYearChart();
}
// Keep old name for compat
function setYearChartMode(mode){ toggleYearChart(mode); }

function renderYearChart(){
  const canvas=document.getElementById('yearChart');if(!canvas)return;
  const ctx=canvas.getContext('2d');const W=canvas.offsetWidth||350,H=100;
  canvas.width=W;canvas.height=H;ctx.clearRect(0,0,W,H);
  const expData=[],incData=[];
  let maxVal=0;
  for(let m=0;m<12;m++){
    const recs=getRecordsByMonth(currentYear,m);
    const e=sumType(recs,'expense'),i=sumType(recs,'income');
    expData.push(e);incData.push(i);
    if(yearChartShowExp&&e>maxVal)maxVal=e;
    if(yearChartShowInc&&i>maxVal)maxVal=i;
  }
  if(!maxVal)maxVal=1;
  const padL=52,padR=8,padT=8,padB=28,chartW=W-padL-padR,chartH=H-padT-padB;
  const groupW=chartW/12,barCount=(yearChartShowExp?1:0)+(yearChartShowInc?1:0);
  const barW=groupW*0.7/Math.max(barCount,1),gap2=barW*0.2;
  // Y axis
  ctx.fillStyle='#4a6080';ctx.font='9px sans-serif';ctx.textAlign='right';
  [0,0.25,0.5,0.75,1].forEach(t=>{
    const y=padT+chartH*(1-t);const v=Math.round(maxVal*t);
    ctx.fillText(v>=1000000?Math.round(v/10000)+'萬':v>=1000?Math.round(v/1000)+'k':v,padL-3,y+3);
    ctx.strokeStyle='#1e2d3d';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
  });
  function drawBar(v,x,color){
    if(!v)return;
    const bH=(v/maxVal)*chartH,y=padT+chartH-bH,r=Math.min(3,barW/2);
    ctx.fillStyle=color;ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+barW-r,y);ctx.quadraticCurveTo(x+barW,y,x+barW,y+r);
    ctx.lineTo(x+barW,y+bH);ctx.lineTo(x,y+bH);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();ctx.fill();
  }
  for(let i=0;i<12;i++){
    const gx=padL+groupW*i+(groupW-(barCount*(barW+gap2)-gap2))/2;
    let bx=gx;
    if(yearChartShowExp){drawBar(expData[i],bx,'#e84040');bx+=barW+gap2;}
    if(yearChartShowInc){drawBar(incData[i],bx,'#2ec4a9');}
    ctx.fillStyle='#4a6080';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText((i+1)+'月',padL+groupW*i+groupW/2,H-padB+14);
  }
}
function renderMiniPie(recs){
  const total=sumType(recs,'expense');if(!total)return`<svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="rgba(255,255,255,0.3)"/></svg>`;
  let a=-Math.PI/2,paths='';
  EXPENSE_CATS.forEach(c=>{
    const v=recs.filter(r=>r.type==='expense'&&r.cat===c.id).reduce((s,r)=>s+r.amount,0);
    if(!v)return;const sw=(v/total)*Math.PI*2;
    const x1=25+22*Math.cos(a),y1=25+22*Math.sin(a);a+=sw;const x2=25+22*Math.cos(a),y2=25+22*Math.sin(a);
    paths+=`<path d="M25,25 L${x1},${y1} A22,22 0 ${sw>Math.PI?1:0},1 ${x2},${y2} Z" fill="${PIE_COLORS[c.id]||'#ccc'}"/>`;
  });
  return`<svg viewBox="0 0 50 50">${paths}</svg>`;
}

function drawDonutPie(canvas, segments, bg='#0d1b2a'){
  if(!canvas) return;
  const ctx=canvas.getContext('2d');const S=220;canvas.width=S;canvas.height=S;
  ctx.clearRect(0,0,S,S);
  const cx=S/2,cy=S/2,R=95,innerR=50;
  const total=segments.reduce((s,c)=>s+c.val,0);
  if(!total){
    ctx.strokeStyle='#2a3a4a';ctx.lineWidth=40;
    ctx.beginPath();ctx.arc(cx,cy,(R+innerR)/2,0,Math.PI*2);ctx.stroke();
    return;
  }
  let a=-Math.PI/2;
  segments.forEach(c=>{
    if(!c.val)return;
    const sw=(c.val/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx+innerR*Math.cos(a),cy+innerR*Math.sin(a));
    ctx.arc(cx,cy,R,a,a+sw);
    ctx.arc(cx,cy,innerR,a+sw,a,true);
    ctx.closePath();
    ctx.fillStyle=c.color;ctx.fill();
    // White divider line
    ctx.strokeStyle=bg;ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(cx+innerR*Math.cos(a),cy+innerR*Math.sin(a));
    ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));
    ctx.stroke();
    a+=sw;
  });
}

function confirmDeleteTxn(assetId, txnId){
  if(!confirm('確定刪除此交易紀錄？刪除後將反應在可用現金。'))return;
  const asset=assets.find(a=>a.id===assetId);if(!asset)return;
  const txn=asset.txns.find(t=>t.id===txnId);if(!txn)return;
  // Reverse cash effect
  if(txn.invested!==0) applyTxnToCash(asset.type, txn.invested, true);
  asset.txns=asset.txns.filter(t=>t.id!==txnId);
  // Recalculate holdAvg for all remaining txns
  recalcHoldAvg(asset);
  // Check if total shares = 0 → auto-delete asset
  if(getAssetShares(asset)===0 && asset.txns.every(t=>t.isDividend||t.readonly)){
    assets=assets.filter(a=>a.id!==assetId);saveAssets();goTab('screen-cangku');return;
  }
  saveAssets();renderAssetDetail(asset);
}

function recalcHoldAvg(asset){
  // Sort txns by date, recalculate holdAvg sequentially
  asset.txns.sort((a,b)=>a.date.localeCompare(b.date));
  let cumShares=0,cumInvested=0;
  asset.txns.forEach(t=>{
    if(t.isDividend||t.readonly){t.holdAvg=cumShares?cumInvested/cumShares:0;return;}
    cumShares+=t.shares; cumInvested+=t.invested;
    t.avgCost=t.shares?parseFloat(fmtNum(Math.abs(t.invested/t.shares))):0;
    t.holdAvg=cumShares?parseFloat(fmtNum(cumInvested/cumShares)):0;
  });
}

function deleteCurrentAsset(){
  if(!confirm('確定刪除此資產？刪除後投入金額將反應在可用現金。'))return;
  const asset=assets.find(a=>a.id===currentAssetId);if(!asset)return;
  // Reverse ALL txn cash effects
  asset.txns.filter(t=>!t.isDividend&&!t.readonly).forEach(t=>{
    if(t.invested!==0) applyTxnToCash(asset.type, t.invested, true);
  });
  assets=assets.filter(a=>a.id!==currentAssetId);saveAssets();goTab('screen-cangku');
}

function saveTxn(){
  const asset=assets.find(a=>a.id===currentAssetId);if(!asset)return;
  const shares=parseFloat(document.getElementById('add-txn-shares').value)||0;
  const invested=parseFloat(document.getElementById('add-txn-invested').value)||0;
  const date=document.getElementById('add-txn-date-val').value;
  const totalShares=getAssetShares(asset)+shares;
  const totalInvested=getAssetInvested(asset)+invested;
  const holdAvg=totalShares?totalInvested/totalShares:0;
  const avgCost=shares?Math.abs(invested/shares):0;
  asset.txns.push({id:genId(),date,shares,invested,avgCost:parseFloat(fmtNum(avgCost)),holdAvg:parseFloat(fmtNum(holdAvg))});
  // ---- Linkage: US stock → usdCash; tw/crypto → twdCash ----
  if(invested!==0) applyTxnToCash(asset.type, invested, false);
  // Auto-delete if total shares = 0 (only non-dividend txns matter)
  if(totalShares===0){
    // Revert all invested cash first was already done per-txn, so just remove
    assets=assets.filter(a=>a.id!==currentAssetId);
    saveAssets();closeModal('add-txn-modal');goTab('screen-cangku');return;
  }
  saveAssets();closeModal('add-txn-modal');renderAssetDetail(asset);
  const active=document.querySelector('.screen.active');
  if(active&&active.id==='screen-settings') renderSettings();
}

(function(){
  let origViewH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  function onViewportChange(){
    if(!window.visualViewport) return;
    const vh = window.visualViewport.height;
    const keyboardUp = (origViewH - vh) > 100;
    document.querySelectorAll('.modal-overlay.open').forEach(el=>{
      el.classList.toggle('keyboard-up', keyboardUp);
      if(keyboardUp){
        // scroll active input into view inside modal
        const active = document.activeElement;
        if(active && el.contains(active)){
          setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100);
        }
      }
    });
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', onViewportChange);
    window.visualViewport.addEventListener('scroll', onViewportChange);
  }
  // Also handle focus events
  document.addEventListener('focusin', ()=>setTimeout(onViewportChange, 300));
  document.addEventListener('focusout', ()=>setTimeout(onViewportChange, 300));
})();

// ============================================================
// LINKAGE: 記帳 ↔ 台幣現金 / 美金現金
// ============================================================
// All income/expense in 記帳 affects twdCash
// (美股/crypto transactions affect usdCash — handled in saveTxn & saveNewAsset)
function applyLedgerToSettings(amount, type, isDelete){
  // positive amount = record amount, type='income'|'expense'
  const delta = type==='income' ? amount : -amount;
  const adj = isDelete ? -delta : delta;
  settings.twdCash = (settings.twdCash||0) + adj;
  if(settings.twdCash < 0) settings.twdCash = 0;
  saveSettingsData();
}

// When a transaction in 現倉 is added:
// US stock: invested is USD → affects usdCash directly (no conversion)
// TW stock / crypto: invested is TWD → affects twdCash
function applyTxnToCash(assetType, investedAmount, isDelete){
  const delta = -investedAmount; // cash changes opposite to invested (buy = cash out)
  const adj = isDelete ? -delta : delta;
  if(assetType==='us'){
    settings.usdCash = (settings.usdCash||0) + adj;
    if(settings.usdCash < 0) settings.usdCash = 0;
  } else {
    settings.twdCash = (settings.twdCash||0) + adj;
    if(settings.twdCash < 0) settings.twdCash = 0;
  }
  saveSettingsData();
}

function saveRecord(){
  const amount=parseFloat(document.getElementById('modal-amount').value);
  if(!amount||amount<=0){document.getElementById('modal-amount').style.borderColor='#e84040';return;}
  document.getElementById('modal-amount').style.borderColor='';
  const note=getModalNote();
  const dateVal=document.getElementById('modal-date-val').value;

  if(modalMode==='add'){
    const type=EXPENSE_CATS.find(c=>c.id===modalCategory)?'expense':'income';
    records.push({id:genId(),date:dateVal,cat:modalCategory,note,amount,type});
    // ---- Linkage: update twdCash ----
    applyLedgerToSettings(amount, type, false);
    // ---- Linkage: 配息 → 現倉資產新增一筆紀錄（股數0,金額-amount,不可編輯）----
    if(modalCategory==='dividend' && note){
      const divAsset = assets.find(a=>a.code===note && a.type==='tw');
      if(divAsset){
        const oldShares=getAssetShares(divAsset);
        const oldInvested=getAssetInvested(divAsset);
        const newInvested=oldInvested-amount; // dividend reduces cost basis
        const holdAvg=oldShares?newInvested/oldShares:0;
        divAsset.txns.push({
          id:genId(), date:dateVal, shares:0, invested:-amount,
          avgCost:0, holdAvg:parseFloat(fmtNum(holdAvg)),
          isDividend:true, readonly:true
        });
        saveAssets();
      }
    }
  } else {
    const rec=records.find(r=>r.id===editingId);
    if(rec){
      // Reverse old linkage
      applyLedgerToSettings(rec.amount, rec.type, true);
      // Apply new
      applyLedgerToSettings(amount, rec.type, false);
      rec.note=note; rec.amount=amount; rec.date=dateVal;
    }
  }

let priceCache = JSON.parse(localStorage.getItem('priceCache')||'{}');
function savePriceCache(){ localStorage.setItem('priceCache', JSON.stringify(priceCache)); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function getCachedPrice(code){
  const c = priceCache[code.toUpperCase()];
  if(c && c.date === todayStr()) return c;
  return null;
}
function setCachedPrice(code, price, name){
  priceCache[code.toUpperCase()] = { price, name: name||code, date: todayStr() };
  savePriceCache();
}

// ---- 報價 API ----
async function fetchTWPrice(code){
  const cached = getCachedPrice(code+'.TW');
  if(cached) return cached;
  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(code+'.TW')}?interval=1d&range=1d`;
    const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxy, {signal: AbortSignal.timeout(8000)});
    const json = await res.json();
    const meta = JSON.parse(json.contents).chart.result[0].meta;
    const price = meta.regularMarketPrice || meta.previousClose;
    const name = meta.shortName || meta.symbol || code;
    setCachedPrice(code+'.TW', price, name);
    return { price, name };
  } catch(e){ return null; }
}
async function fetchUSPrice(code){
  const cached = getCachedPrice(code);
  if(cached) return cached;
  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(code)}?interval=1d&range=1d`;
    const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxy, {signal: AbortSignal.timeout(8000)});
    const json = await res.json();
    const meta = JSON.parse(json.contents).chart.result[0].meta;
    const price = meta.regularMarketPrice || meta.previousClose;
    const name = meta.shortName || meta.longName || code;
    setCachedPrice(code, price, name);
    return { price, name };
  } catch(e){ return null; }
}
const COIN_ID_MAP = {
  'BTC':'bitcoin','ETH':'ethereum','BNB':'binancecoin','SOL':'solana',
  'XRP':'ripple','ADA':'cardano','DOGE':'dogecoin','DOT':'polkadot',
  'MATIC':'matic-network','LINK':'chainlink','LTC':'litecoin','AVAX':'avalanche-2',
  'UNI':'uniswap','ATOM':'cosmos','TRX':'tron','TON':'the-open-network',
};
async function fetchCryptoPrice(symbol){
  const key = symbol.toUpperCase();
  const cached = getCachedPrice(key);
  if(cached) return cached;
  try {
    let coinId = COIN_ID_MAP[key];
    if(!coinId){
      const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent('https://api.coingecko.com/api/v3/search?query='+encodeURIComponent(symbol))}`;
      const res = await fetch(proxy, {signal: AbortSignal.timeout(8000)});
      const data = JSON.parse((await res.json()).contents);
      if(data.coins?.length) coinId = data.coins[0].id;
    }
    if(!coinId) return null;
    const proxy2 = `https://api.allorigins.win/get?url=${encodeURIComponent('https://api.coingecko.com/api/v3/simple/price?ids='+coinId+'&vs_currencies=usd')}`;
    const res2 = await fetch(proxy2, {signal: AbortSignal.timeout(8000)});
    const data2 = JSON.parse((await res2.json()).contents);
    const price = data2[coinId]?.usd;
    if(!price) return null;
    setCachedPrice(key, price, key);
    return { price, name: key };
  } catch(e){ return null; }
}

function saveNewAsset(){
  const code = document.getElementById('add-asset-code').value.trim().toUpperCase();
  if(!code){ alert('請輸入代碼'); return; }
  const shares = parseFloat(document.getElementById('add-asset-shares').value)||0;
  const invested = parseFloat(document.getElementById('add-asset-invested').value)||0;
  const cost = parseFloat(document.getElementById('add-asset-cost').value)||0;
  const date = document.getElementById('add-asset-date-val').value;
  const holdAvg = shares && invested ? invested/shares : cost;
  const name = selectedAssetMeta?.name || code;
  const price = selectedAssetMeta?.price || cost;

  // Check duplicate
  if(assets.find(a=>a.code===code)){
    // Add txn to existing asset instead
    const existing = assets.find(a=>a.code===code);
    const totalShares = getAssetShares(existing)+shares;
    const totalInvested = getAssetInvested(existing)+invested;
    const newHoldAvg = totalShares ? totalInvested/totalShares : 0;
    existing.txns.push({id:genId(),date,shares,invested,avgCost:parseFloat(fmtNum(cost)),holdAvg:parseFloat(fmtNum(newHoldAvg))});
    if(price) existing.currentPrice = price;
  } else {
    assets.push({
      id:genId(), code, name, type:newAssetType, currentPrice:price,
      priceDate: price ? todayStr() : null,
      txns:[{id:genId(),date,shares,invested,avgCost:parseFloat(fmtNum(cost)),holdAvg:parseFloat(fmtNum(holdAvg))}]
    });
  }

  // ---- Linkage: update cash ----
  if(invested !== 0) applyTxnToCash(newAssetType, invested, false);

  saveAssets(); closeModal('add-asset-modal'); renderCangku();
}

async function refreshAllPrices(){

  if(!toUpdate.length) return;

  // Update quietly in background
  for(const asset of toUpdate){
    try {
      let r = null;
      if(asset.type==='tw') r = await fetchTWPrice(asset.code);
      else if(asset.type==='us') r = await fetchUSPrice(asset.code);
      else r = await fetchCryptoPrice(asset.code);
      if(r && r.price){
        asset.currentPrice = r.price;
        asset.name = r.name || asset.name;
        asset.priceDate = today;
      }
    } catch(e){}
  }
  saveAssets();
  // Re-render if still on cangku screen
  const active = document.querySelector('.screen.active');
  if(active && active.id === 'screen-cangku') renderCangku();
}

    {label:'台股投入',val:Math.abs(twInvested),color:'#4a9ede'},
    {label:'美股投入',val:Math.abs(usInvested),color:'#f0a06a'},
  ];
  const pieTotal=cats.reduce((s,c)=>s+c.val,0)||1;

  const legend=document.createElement('div');legend.className='settings-legend';
  cats.forEach(c=>{
    const pct=pieTotal?(c.val/pieTotal*100).toFixed(1):'0.0';
    const item=document.createElement('div');item.className='settings-legend-item';
    item.innerHTML=`<div class="settings-legend-left"><div class="settings-legend-dot" style="background:${c.color}"></div><span class="settings-legend-name">${c.label}</span></div>
      <span class="settings-legend-val">${pct}% ($${Math.round(c.val).toLocaleString()})</span>`;
    legend.appendChild(item);
  });
  content.appendChild(legend);

  const div=document.createElement('div');div.className='settings-divider';content.appendChild(div);

  // Current month stats — all records this calendar month (start to end of month, or today if current month)
  const now=new Date();
  const mRecs=getRecordsByMonth(now.getFullYear(),now.getMonth());
  const mExp=sumType(mRecs,'expense'),mInc=sumType(mRecs,'income');
  const stats=document.createElement('div');
  stats.innerHTML=`
    <div class="settings-stat-row"><span class="settings-stat-label">${now.getMonth()+1}月至今的支出總額</span><span class="settings-stat-red">$${mExp.toLocaleString()}</span></div>
    <div class="settings-stat-row"><span class="settings-stat-label">${now.getMonth()+1}月至今的收入總額</span><span class="settings-stat-teal">$${mInc.toLocaleString()}</span></div>`;
  content.appendChild(stats);

  setTimeout(()=>{
    const canvas=document.getElementById('settingsPie');if(!canvas)return;
    canvas.width=200;canvas.height=200;
    // Draw donut using same helper but scaled for 200px
    const ctx=canvas.getContext('2d');const S=200;
    ctx.clearRect(0,0,S,S);
    const cx=S/2,cy=S/2,R=80,innerR=42;
    const segs=cats.filter(c=>c.val>0);
    const pt=segs.reduce((s,c)=>s+c.val,0);
    if(!pt){ctx.strokeStyle='#2a3a4a';ctx.lineWidth=32;ctx.beginPath();ctx.arc(cx,cy,(R+innerR)/2,0,Math.PI*2);ctx.stroke();return;}
    let a=-Math.PI/2;
    segs.forEach(c=>{
      const sw=(c.val/pt)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx+innerR*Math.cos(a),cy+innerR*Math.sin(a));
      ctx.arc(cx,cy,R,a,a+sw);ctx.arc(cx,cy,innerR,a+sw,a,true);ctx.closePath();
      ctx.fillStyle=c.color;ctx.fill();
      ctx.strokeStyle='#0d1b2a';ctx.lineWidth=2.5;ctx.beginPath();
      ctx.moveTo(cx+innerR*Math.cos(a),cy+innerR*Math.sin(a));
      ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));ctx.stroke();
      a+=sw;
    });
  },50);
}

function backupData(){

  const filename = `jizhang-backup-${todayStr()}.json`;
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);

  // Always trigger file download first — user can then upload to Google Drive etc.
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();

function restoreData(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.records)records=d.records;
        if(d.assets)assets=d.assets;
        if(d.settings)settings=d.settings;
        saveRecords();saveAssets();saveSettingsData();
        closeModal('settings-modal');renderSettings();
        alert('還原成功！');
      }catch{alert('檔案格式錯誤');}
    };
    reader.readAsText(file);
  };
  input.click();
}

  const grid=document.getElementById('cal-grid');
  grid.innerHTML=['日','一','二','三','四','五','六'].map(d=>`<div class="cal-header">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const prev=new Date(calYear,calMonth,0).getDate();
  let cells='';
  for(let i=0;i<first;i++)cells+=`<div class="cal-day other-month">${prev-first+1+i}</div>`;
  for(let d=1;d<=days;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls=['cal-day',ds===sel?'selected':'',ds===today?'today':''].filter(Boolean).join(' ');
    cells+=`<div class="${cls}" onclick="selectCalDay('${ds}')">${d}</div>`;
  }
  grid.innerHTML+=cells;
}
function selectCalDay(ds){
  const d=parseDate(ds);
  const label=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  if(calCallbackTarget==='ledger'){
    document.getElementById('modal-date-val').value=ds;
    document.getElementById('modal-date-display').value=formatDateDisplay(ds);
  } else if(calCallbackTarget==='ledger-date'){
    // Jump ledger to selected date
    currentDate=parseDate(ds);
    renderLedger();
  } else if(calCallbackTarget==='asset'){
    document.getElementById('add-asset-date-val').value=ds;
    document.getElementById('add-asset-date').value=label;
  } else if(calCallbackTarget==='txn'){
    document.getElementById('add-txn-date-val').value=ds;
    document.getElementById('add-txn-date').value=ds;
  }
  closeCalendar();
}

// ============================================================
// DROPBOX BACKUP / RESTORE
// Using Dropbox Chooser SDK (no OAuth needed for restore)
// and Dropbox API v2 upload for backup (app key required)
// ============================================================
const DROPBOX_APP_KEY = 3azbbmrn3npc79z ; // 見說明

// Load Dropbox SDK lazily
function loadDropboxSDK(cb){
  if(window.Dropbox){ cb(); return; }
  const s=document.createElement('script');
  s.src='https://www.dropbox.com/static/api/2/dropins.js';
  s.id='dropboxjs';
  s.setAttribute('data-app-key', DROPBOX_APP_KEY);
  s.onload=cb;
  document.head.appendChild(s);
}

function setDropboxStatus(msg, color){
  const el=document.getElementById('dropbox-status');
  if(el){ el.textContent=msg; el.style.color=color||'#7a9ab8'; }
}

// 備份：先取得授權 token → 上傳 JSON 到 Dropbox
function dropboxBackup(){
  // For a simple token-based approach: use PKCE OAuth popup
  // If no app key configured, fall back to local download
  if(DROPBOX_APP_KEY==='YOUR_DROPBOX_APP_KEY'){
    setDropboxStatus('請先在設置中設定 Dropbox App Key', '#f0a06a');
    // Still do local download as fallback
    backupData();
    return;
  }
  loadDropboxSDK(()=>_doDropboxBackup());
}

async function _doDropboxBackup(){
  setDropboxStatus('連線 Dropbox 中…', '#7a9ab8');
  const token = await getDropboxToken();
  if(!token){ setDropboxStatus('授權取消', '#e84040'); return; }
  const data = JSON.stringify({records, assets, settings}, null, 2);
  const filename = `/jizhang-backup-${todayStr()}.json`;
  try {
    const res = await fetch('https://content.dropboxapi.com/2/files/upload', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Dropbox-API-Arg': JSON.stringify({
          path: filename,
          mode: 'overwrite',
          autorename: false,
          mute: false
        }),
        'Content-Type': 'application/octet-stream'
      },
      body: data
    });
    if(res.ok){
      const j = await res.json();
      setDropboxStatus(`✓ 已備份至 Dropbox: ${j.name}`, '#2ec4a9');
    } else {
      const err = await res.json();
      setDropboxStatus('備份失敗: '+err.error_summary, '#e84040');
    }
  } catch(e){
    setDropboxStatus('網路錯誤: '+e.message, '#e84040');
  }
}

// 還原：用 Dropbox Chooser 選擇備份檔案
function dropboxRestore(){
  if(DROPBOX_APP_KEY==='YOUR_DROPBOX_APP_KEY'){
    setDropboxStatus('請先設定 Dropbox App Key', '#f0a06a');
    restoreData(); // fallback to local
    return;
  }
  loadDropboxSDK(()=>_doDropboxRestore());
}

function _doDropboxRestore(){
  setDropboxStatus('開啟 Dropbox 選擇器…', '#7a9ab8');
  if(!window.Dropbox){ setDropboxStatus('Dropbox SDK 載入失敗', '#e84040'); return; }
  Dropbox.choose({
    success: async function(files){
      if(!files.length) return;
      setDropboxStatus('下載備份中…', '#7a9ab8');
      try {
        const res = await fetch(files[0].link);
        const text = await res.text();
        const d = JSON.parse(text);
        if(d.records) records=d.records;
        if(d.assets) assets=d.assets;
        if(d.settings) settings=d.settings;
        saveRecords(); saveAssets(); saveSettingsData();
        setDropboxStatus('✓ 還原成功！', '#2ec4a9');
        closeModal('settings-modal');
        renderSettings();
      } catch(e){
        setDropboxStatus('還原失敗: '+e.message, '#e84040');
      }
    },
    cancel: function(){ setDropboxStatus('', ''); },
    linkType: 'direct',
    multiselect: false,
    extensions: ['.json'],
    folderselect: false
  });
}

// Simple PKCE OAuth token flow (opens popup)
let _dropboxTokenResolve = null;
function getDropboxToken(){
  return new Promise(resolve=>{
    // Check localStorage cache
    const cached = localStorage.getItem('dbx_token');
    const exp = parseInt(localStorage.getItem('dbx_token_exp')||'0');
    if(cached && Date.now() < exp){ resolve(cached); return; }
    _dropboxTokenResolve = resolve;
    // Open Dropbox OAuth popup
    const state = Math.random().toString(36).substr(2);
    const redirectUri = encodeURIComponent(window.location.href.split('?')[0]);
    const url = `https://www.dropbox.com/oauth2/authorize?`+
      `client_id=${DROPBOX_APP_KEY}&response_type=token`+
      `&redirect_uri=${redirectUri}&state=${state}`;
    const popup = window.open(url,'dropbox_auth','width=600,height=700');
    // Poll for token in URL hash (redirect_uri brings token back)
    const check = setInterval(()=>{
      try {
        if(popup.closed){ clearInterval(check); resolve(null); return; }
        const hash = popup.location.hash;
        if(hash && hash.includes('access_token')){
          clearInterval(check);
          popup.close();
          const params = new URLSearchParams(hash.slice(1));
          const token = params.get('access_token');
          const expiresIn = parseInt(params.get('expires_in')||'14400')*1000;
          localStorage.setItem('dbx_token', token);
          localStorage.setItem('dbx_token_exp', String(Date.now()+expiresIn));
          resolve(token);
        }
      } catch(e){ /* cross-origin, wait */ }
    }, 500);
  });
}
