<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google 授權</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0d1b2a; font-family:sans-serif; padding:24px 20px; min-height:100vh; }
  h2 { color:#2ec4a9; font-size:18px; margin-bottom:16px; text-align:center; }
  .card { background:#1a2a3a; border-radius:14px; padding:18px; margin-bottom:16px; }
  .label { font-size:12px; color:#7a9ab8; font-weight:600; margin-bottom:8px; }
  .token-box {
    background:#0d1b2a; border-radius:8px; padding:12px;
    font-size:12px; color:#2ec4a9; word-break:break-all;
    line-height:1.6; font-family:monospace; cursor:pointer;
    border:1.5px solid #2ec4a9;
  }
  .copy-btn {
    width:100%; padding:14px; background:#2ec4a9; color:white; border:none;
    border-radius:10px; font-size:15px; font-weight:700; cursor:pointer;
    margin-top:12px; font-family:sans-serif;
  }
  .copy-btn:active { background:#25a892; }
  .tip { font-size:12px; color:#7a9ab8; line-height:1.7; }
  .tip b { color:white; }
  .err { color:#e84040; font-size:14px; text-align:center; padding:20px; }
  .copied { background:#34a853 !important; }
</style>
</head>
<body>
<div id="content"></div>
<script>
(function(){
  const hash = window.location.hash.slice(1);
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');
  const expiresIn = parseInt(params.get('expires_in')||'3600');
  const content = document.getElementById('content');

  if(!token){
    content.innerHTML = '<div class="err">授權失敗或被取消，請關閉此頁面重試。</div>';
    return;
  }

  content.innerHTML = `
    <h2>✓ 授權成功！</h2>
    <div class="card">
      <div class="label">你的授權碼（點擊複製）</div>
      <div class="token-box" id="token-box" onclick="copyToken()">${token}</div>
      <button class="copy-btn" id="copy-btn" onclick="copyToken()">📋 點此複製授權碼</button>
    </div>
    <div class="card">
      <div class="tip">
        <b>步驟：</b><br>
        1. 點上方「複製授權碼」按鈕<br>
        2. 回到記帳 App<br>
        3. 將授權碼貼入輸入框<br>
        4. 點「確認」即完成連線<br><br>
        <span style="color:#f0a06a;">⚠️ 授權碼約 1 小時後失效，失效後重新操作即可。</span>
      </div>
    </div>`;

  function copyToken(){
    navigator.clipboard.writeText(token).then(()=>{
      const btn = document.getElementById('copy-btn');
      btn.textContent = '✓ 已複製！請返回 App 貼上';
      btn.classList.add('copied');
    }).catch(()=>{
      // Fallback: select the text
      const box = document.getElementById('token-box');
      const range = document.createRange();
      range.selectNodeContents(box);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      const btn = document.getElementById('copy-btn');
      btn.textContent = '✓ 已複製！請返回 App 貼上';
      btn.classList.add('copied');
    });
  }
  window.copyToken = copyToken;

  // Also try deep link (bonus — works if manifest is patched)
  try {
    const deepLink = 'jizhang://oauth#' + hash;
    window.location.href = deepLink;
  } catch(e){}
})();
</script>
</body>
</html>
